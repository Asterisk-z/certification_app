name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # CI — backend tests + production asset build
  # -------------------------------------------------------------------------
  tests:
    name: Tests & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, zip, intl, bcmath, pdo_sqlite, sqlite3, mbstring, xml
          coverage: none

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: php artisan test

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

  # -------------------------------------------------------------------------
  # CD — build and publish Docker images to GHCR on every push to main.
  # Deploy by pulling these images on your server:
  #   ghcr.io/asterisk-z/certification_app/app   (php-fpm + chromium)
  #   ghcr.io/asterisk-z/certification_app/web   (nginx + assets)
  # -------------------------------------------------------------------------
  docker:
    name: Publish Docker images
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ghcr.io/asterisk-z/certification_app/app:latest
            ghcr.io/asterisk-z/certification_app/app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ghcr.io/asterisk-z/certification_app/web:latest
            ghcr.io/asterisk-z/certification_app/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
