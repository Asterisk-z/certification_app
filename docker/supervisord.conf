; Runs the whole app in one container, matching the other hseboard sites:
; HTTP server, queue worker and scheduler under supervisord.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:app]
command=php -d variables_order=EGPCS artisan serve --host=0.0.0.0 --port=80
directory=/var/www/html
user=www-data
environment=PHP_CLI_SERVER_WORKERS="4",HOME="/var/www",USER="www-data"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue]
command=php artisan queue:work --queue=emails,default --tries=3 --backoff=60 --max-time=3600 --sleep=3
directory=/var/www/html
user=www-data
environment=HOME="/var/www",USER="www-data"
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=/bin/sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
directory=/var/www/html
user=www-data
environment=HOME="/var/www",USER="www-data"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
