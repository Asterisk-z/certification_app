# Production stack for setup.certification.hseboard.com — single container,
# matching the other hseboard sites: supervisord runs the HTTP server, the
# queue worker and the scheduler inside one container, and the dockerised
# Caddy (hsewebserver) proxies setup.certification.hseboard.com to it by
# container name over the shared hse-app-network.
#
# Database: SQLite (WAL) on the `storage` volume — no database server.
# Back up storage/app/database/database.sqlite from the volume.
#
# On the server:
#   cp .env.production.example .env     # then fill in the values
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker logs -f setupcertificationhseboard   # watch boot + supervisor

services:
  app:
    build:
      context: .
      target: app
    image: hse-credential-app
    container_name: setupcertificationhseboard
    restart: unless-stopped
    command: supervisord -c /etc/supervisor/conf.d/app.conf
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database/database.sqlite
      CHROME_PATH: /usr/bin/chromium
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - storage:/var/www/html/storage
    networks:
      - hse-app-network

networks:
  # Shared network that Caddy (hsewebserver) lives on — created by the
  # root /var/www/docker-compose.yaml.
  hse-app-network:
    external: true

volumes:
  storage:
